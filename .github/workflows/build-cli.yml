name: Build Jixel CLI

on:
  push:
    branches: [master, main]
    tags: ['v*', '[0-9]*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jixel-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 CLI
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Build release executable
        run: cargo build --release --manifest-path app/Cargo.toml --bin jixel
      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: jixel.exe
          path: target/release/jixel.exe
          if-no-files-found: error
          compression-level: 0

  linux-x64:
    name: Linux x64 CLI
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Build release executable
        run: cargo build --release --manifest-path app/Cargo.toml --bin jixel
      - name: Upload Linux executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: jixel-linux
          path: target/release/jixel
          if-no-files-found: error
          compression-level: 0

  release-assets:
    name: Publish raw release binaries
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-x64, linux-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows executable artifact
        uses: actions/download-artifact@v4
        with:
          name: jixel.exe
          path: dist/windows
      - name: Download Linux executable artifact
        uses: actions/download-artifact@v4
        with:
          name: jixel-linux
          path: dist/linux
      - name: Name Linux release asset
        run: cp dist/linux/jixel dist/linux/jixel-linux
      - name: Attach executable files directly to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/jixel.exe
            dist/linux/jixel-linux
